name: quiz_app_front
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.8
  
  google_sign_in: ^6.2.1 
  http: ^1.2.2
  shared_preferences: ^2.3.2
  connectivity_plus: ^7.0.0
  font_awesome_flutter: ^10.7.0
  
  # 🎯 AJOUTS POUR LE MODE HORS LIGNE
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^3.0.0 
  flutter_launcher_icons: ^0.13.1

# Configuration de l'icône de lancement
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/quiz-logo.png"

flutter:
  uses-material-design: true

  # Déclarez votre dossier d'assets (requis pour la Phase 2)
  assets:
    - assets/images/
    - assets/quiz/ 