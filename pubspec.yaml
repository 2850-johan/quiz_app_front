name: quiz_app_front
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.8
  
  google_sign_in: ^6.2.1 
  http: ^1.2.2
  shared_preferences: ^2.3.2
  connectivity_plus: ^7.0.0
  font_awesome_flutter: ^10.7.0 # ⬅️ AJOUTÉ pour les icônes Google/Mail
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/quiz-logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/